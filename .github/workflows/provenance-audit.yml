name: Berne Provenance Forensic Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  forensic-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run zero-dependency end-to-end self-test
        run: |
          chmod +x run_self_test.sh
          ./run_self_test.sh
